apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: go-service-template
  title: Go Microservice
  description: Create a simple HTTP server in Go with optional ArgoCD deployment
  tags:
    - go
    - golang
    - backend
    - argocd
spec:
  owner: guests
  type: service

  parameters:
    - title: Provide some simple information
      required:
        - component_id
        - owner
        - description
      properties:
        component_id:
          title: Name
          type: string
          description: Unique name of the component
          ui:field: EntityNamePicker
        description:
          title: Description
          type: string
          description: Help others understand what this service is for.
        owner:
          title: Owner
          type: string
          description: Owner of the component
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group

    - title: Choose a Location
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

    - title: Deployment Options
      properties:
        deployToCluster:
          title: Deploy to Kubernetes via ArgoCD
          type: boolean
          default: true
          description: Create an ArgoCD application to deploy this service
        namespace:
          title: Target Namespace
          type: string
          default: default
          description: Kubernetes namespace to deploy to
        syncPolicy:
          title: Sync Policy
          type: string
          default: automated
          enum:
            - manual
            - automated

  steps:
    - id: fetch-base
      name: Fetch Base
      action: fetch:template
      input:
        url: ./content
        values:
          component_id: ${{ parameters.component_id }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}

    - id: publish
      name: Publish
      action: publish:github
      input:
        description: This is ${{ parameters.component_id }}
        repoUrl: ${{ parameters.repoUrl }}

    - id: register
      name: Register
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

    - id: deploy-argocd
      name: Deploy via ArgoCD
      if: ${{ parameters.deployToCluster }}
      action: github:actions:dispatch
      input:
        workflowId: argocd-deploy.yml
        repoUrl: github.com?repo=backstage-infra&owner=Shrinet82
        branchOrTagName: main
        workflowInputs:
          app_name: ${{ parameters.component_id }}
          namespace: ${{ parameters.namespace }}
          repo_url: ${{ steps['publish'].output.remoteUrl }}
          path: 'k8s'
          branch: main
          sync_policy: ${{ parameters.syncPolicy }}
          prune: 'true'
          self_heal: 'true'
          notify_email: ''

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
      - title: ArgoCD Dashboard
        url: https://143.110.177.137:32477/applications/${{ parameters.component_id }}
